<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Live Formation Detection — Prototype</title>
<style>
  :root{
    --bg: #0a0e0d;
    --panel: #101614;
    --pitch: #103d2a;
    --pitch-line: rgba(255,255,255,0.55);
    --teamA: #3fd1c9;
    --teamB: #ff7a45;
    --amber: #ffb703;
    --text: #e9f1ee;
    --dim: #7f9791;
    --mono: ui-monospace, "SFMono-Regular", "JetBrains Mono", Consolas, monospace;
    --disp: "Arial Narrow", "Helvetica Neue Condensed", Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family: var(--mono);
    padding:20px;
  }
  .wrap{
    max-width:1180px; margin:0 auto;
    display:grid; grid-template-columns: 1fr 340px; gap:18px;
  }
  @media (max-width:900px){ .wrap{grid-template-columns:1fr;} }

  h1{
    font-family:var(--disp); font-weight:900; letter-spacing:0.5px;
    text-transform:uppercase; font-size:22px; margin:0 0 4px 0;
  }
  .sub{ color:var(--dim); font-size:12.5px; margin-bottom:14px; }

  .card{
    background:var(--panel); border:1px solid rgba(255,255,255,0.06);
    border-radius:6px; padding:14px;
  }

  #pitchCanvas{ width:100%; display:block; border-radius:4px; }

  .controls{ display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  button{
    background:transparent; color:var(--text); border:1px solid rgba(255,255,255,0.18);
    padding:7px 12px; border-radius:4px; cursor:pointer; font-family:var(--disp);
    text-transform:uppercase; letter-spacing:0.5px; font-size:12px;
  }
  button:hover{ border-color:var(--teamA); color:var(--teamA); }
  button.active{ border-color:var(--amber); color:var(--amber); }

  .label{ font-size:10.5px; color:var(--dim); text-transform:uppercase; letter-spacing:1px; margin-bottom:6px; }

  .formation-box{ display:flex; align-items:baseline; gap:10px; margin-bottom:14px; }
  .swatch{ width:10px; height:10px; border-radius:2px; flex-shrink:0; }
  .formation-str{ font-family:var(--disp); font-weight:900; font-size:26px; letter-spacing:1px; }
  .conf{ font-size:11px; color:var(--dim); }

  .trace{ font-size:11px; line-height:1.65; color:var(--dim); white-space:pre-wrap; word-break:break-word; }
  .trace .hi{ color:var(--amber); }
  .trace .gapline{ color:var(--teamA); }

  hr{ border:none; border-top:1px solid rgba(255,255,255,0.08); margin:14px 0; }
</style>
</head>
<body>
<div class="wrap">

  <div class="card">
    <h1>Live Formation Detection</h1>
    <div class="sub">Simulated 22-player tracking feed → depth-clustering algorithm → formation label, updated every tick.</div>
    <canvas id="pitchCanvas" width="900" height="560"></canvas>
    <div class="controls">
      <button id="btnPause">Pause</button>
      <button id="btnShiftA">Shift Team A: Attack ↔ Block</button>
      <button id="btnShiftB">Shift Team B: Attack ↔ Block</button>
    </div>
  </div>

  <div class="card">
    <div class="label">Team A</div>
    <div class="formation-box">
      <div class="swatch" style="background:var(--teamA)"></div>
      <div class="formation-str" id="formA">—</div>
      <div class="conf" id="confA"></div>
    </div>
    <div class="trace" id="traceA"></div>

    <hr>

    <div class="label">Team B</div>
    <div class="formation-box">
      <div class="swatch" style="background:var(--teamB)"></div>
      <div class="formation-str" id="formB">—</div>
      <div class="conf" id="confB"></div>
    </div>
    <div class="trace" id="traceB"></div>
  </div>

</div>

<script>
const canvas = document.getElementById('pitchCanvas');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// ---------- simulation state ----------
// x: 0 = own goal line, 1 = opponent goal line (attacking direction)
// Team A attacks left->right, Team B attacks right->left (mirrored internally)
function makePlayers(baseLines, spread){
  // baseLines: array of {depth, count} defining a starting shape, e.g. [{depth:0.12,count:4},{depth:0.42,count:3},{depth:0.72,count:3}]
  const players = [];
  baseLines.forEach(line=>{
    for(let i=0;i<line.count;i++){
      const t = line.count===1 ? 0.5 : i/(line.count-1);
      players.push({
        baseX: line.depth,
        baseY: 0.08 + t*0.84,
        x: line.depth,
        y: 0.08 + t*0.84,
        phase: Math.random()*Math.PI*2,
        speed: 0.4 + Math.random()*0.4
      });
    }
  });
  return players;
}

let teamA = makePlayers([{depth:0.10,count:4},{depth:0.40,count:3},{depth:0.72,count:3}]);
let teamB = makePlayers([{depth:0.10,count:4},{depth:0.38,count:4},{depth:0.68,count:2}]);
let gkA = {x:0.03,y:0.5}, gkB = {x:0.03,y:0.5}; // rendered mirrored for B

let shiftA = 0, shiftB = 0; // -1 defensive block, +1 high press, animated target
let targetShiftA = 0, targetShiftB = 0;
let paused = false;
let t = 0;

function step(dt){
  if(paused) return;
  t += dt;
  shiftA += (targetShiftA - shiftA)*0.02;
  shiftB += (targetShiftB - shiftB)*0.02;

  [teamA,teamB].forEach((team,idx)=>{
    const shift = idx===0? shiftA: shiftB;
    team.forEach(p=>{
      const wobble = Math.sin(t*p.speed + p.phase)*0.02;
      p.x = clamp(p.baseX + shift*0.18 + wobble, 0.05, 0.95);
      p.y = clamp(p.baseY + Math.cos(t*p.speed*0.7+p.phase)*0.015, 0.05, 0.95);
    });
  });
}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}

// ---------- formation detection algorithm ----------
function detectFormation(team){
  const xs = team.map(p=>p.x).sort((a,b)=>a-b);
  const gaps = [];
  for(let i=1;i<xs.length;i++) gaps.push({idx:i, size:xs[i]-xs[i-1]});

  // candidate: split at the 3 largest gaps -> up to 4 lines
  const sortedGaps = [...gaps].sort((a,b)=>b.size-a.size);
  const topGaps = sortedGaps.slice(0,3);
  const MIN_GAP = 0.07; // below this, a gap isn't considered a real line break

  // keep only gaps that clear the threshold, ordered by position for splitting
  const splitPoints = topGaps.filter(g=>g.size >= MIN_GAP)
                              .map(g=>g.idx)
                              .sort((a,b)=>a-b);

  const clusters = [];
  let start = 0;
  splitPoints.forEach(sp=>{
    clusters.push(xs.slice(start, sp));
    start = sp;
  });
  clusters.push(xs.slice(start));

  const counts = clusters.map(c=>c.length);
  const formation = counts.join('-');

  // confidence: how decisively the chosen gaps clear the threshold vs the smallest kept gap
  const smallestKept = splitPoints.length ? Math.min(...topGaps.filter(g=>g.size>=MIN_GAP).map(g=>g.size)) : 0;
  const confidence = Math.round(Math.min(100, (smallestKept/MIN_GAP)*55 + 30));

  return { formation, counts, xs, gaps, splitPoints, confidence };
}

// ---------- rendering ----------
function drawPitch(){
  ctx.fillStyle = '#0c2f20';
  ctx.fillRect(0,0,W,H);
  ctx.strokeStyle = 'rgba(255,255,255,0.35)';
  ctx.lineWidth = 2;
  ctx.strokeRect(20,20,W-40,H-40);
  ctx.beginPath(); ctx.moveTo(W/2,20); ctx.lineTo(W/2,H-20); ctx.stroke();
  ctx.beginPath(); ctx.arc(W/2,H/2,60,0,Math.PI*2); ctx.stroke();
  // penalty boxes
  ctx.strokeRect(20,H/2-100,110,200);
  ctx.strokeRect(W-130,H/2-100,110,200);
}

function fieldPos(x, y, mirrored){
  const px = mirrored ? (1-x) : x;
  return {
    cx: 20 + px*(W-40),
    cy: 20 + y*(H-40)
  };
}

function drawTeam(team, color, mirrored){
  team.forEach(p=>{
    const {cx,cy} = fieldPos(p.x,p.y,mirrored);
    ctx.beginPath();
    ctx.arc(cx,cy,9,0,Math.PI*2);
    ctx.fillStyle = color;
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.4)';
    ctx.stroke();
  });
}

function drawLineMarkers(detected, color, mirrored){
  // draw a faint vertical guide at each cluster's mean depth
  let idx = 0;
  detected.counts.forEach(count=>{
    const slice = detected.xs.slice(idx, idx+count);
    const meanX = slice.reduce((a,b)=>a+b,0)/slice.length;
    idx += count;
    const {cx} = fieldPos(meanX, 0, mirrored);
    ctx.strokeStyle = color.replace(')', ',0.35)').replace('rgb','rgba');
    ctx.setLineDash([5,5]);
    ctx.beginPath();
    ctx.moveTo(cx,24); ctx.lineTo(cx,H-24);
    ctx.stroke();
    ctx.setLineDash([]);
  });
}

function fmtGaps(gaps, splitPoints){
  return gaps.map(g=>{
    const isSplit = splitPoints.includes(g.idx);
    const s = g.size.toFixed(3);
    return isSplit ? `[${s}]` : s;
  }).join('  ');
}

function updatePanel(id, detected, colorClass){
  document.getElementById('form'+id).textContent = detected.formation;
  document.getElementById('conf'+id).textContent = `${detected.confidence}% confidence`;
  const xsStr = detected.xs.map(v=>v.toFixed(2)).join(', ');
  document.getElementById('trace'+id).innerHTML =
    `depths (own goal→attack):\n${xsStr}\n\n` +
    `gaps <span class="hi">[bracketed = line break]</span>:\n<span class="gapline">${fmtGaps(detected.gaps, detected.splitPoints)}</span>`;
}

function render(){
  drawPitch();
  const detA = detectFormation(teamA);
  const detB = detectFormation(teamB);
  drawLineMarkers(detA, 'rgb(63,209,201)', false);
  drawLineMarkers(detB, 'rgb(255,122,69)', true);
  drawTeam(teamA, getCss('--teamA'), false);
  drawTeam(teamB, getCss('--teamB'), true);
  // goalkeepers
  const gA = fieldPos(gkA.x, gkA.y, false);
  const gB = fieldPos(gkB.x, gkB.y, true);
  [ [gA,'--teamA'], [gB,'--teamB'] ].forEach(([pos,varName])=>{
    ctx.beginPath(); ctx.arc(pos.cx,pos.cy,9,0,Math.PI*2);
    ctx.fillStyle = getCss(varName); ctx.globalAlpha=0.55; ctx.fill(); ctx.globalAlpha=1;
  });
  updatePanel('A', detA);
  updatePanel('B', detB);
}
function getCss(varName){ return getComputedStyle(document.documentElement).getPropertyValue(varName).trim(); }

let last = performance.now();
function loop(now){
  const dt = (now-last)/1000; last = now;
  step(dt);
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ---------- controls ----------
document.getElementById('btnPause').addEventListener('click', e=>{
  paused = !paused;
  e.target.textContent = paused ? 'Resume' : 'Pause';
  e.target.classList.toggle('active', paused);
});
document.getElementById('btnShiftA').addEventListener('click', e=>{
  targetShiftA = targetShiftA <= 0 ? 1 : -1;
  e.target.classList.toggle('active');
});
document.getElementById('btnShiftB').addEventListener('click', e=>{
  targetShiftB = targetShiftB <= 0 ? 1 : -1;
  e.target.classList.toggle('active');
});
</script>
</body>
</html>
